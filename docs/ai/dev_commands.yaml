format: cargo fmt --all -- --check
test: cargo test --workspace
strict_lint: cargo clippy --workspace --all-targets --all-features -- -D warnings
focused_adapter_test: cargo test -p zk_llm_gateway actum::tests
local_paid_example: cargo run --locked -p zk_llm_client --example local_paid_smoke
